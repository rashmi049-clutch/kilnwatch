<title>NCR Kiln Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F1F2F3; --surface:#FFFFFF; --ink:#1C1F22; --muted:#5D646B; --line:#D5D9DD;
  --accent:#9C3F2A; --accent-soft:#F3E3DE;
  --me:#2D5C88; --me-soft:#DFE9F3;
  --you:#8A5A00; --you-soft:#F6EAD0;
  --both:#4E6B3A; --both-soft:#E3EDDA;
  --done:#2F7A4F; --done-soft:#DDEFE3;
  --display:"Archivo","Arial Narrow",sans-serif;
  --body:"Source Sans 3",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15181B; --surface:#1D2125; --ink:#E6E8EA; --muted:#9AA2AA; --line:#30363C;
    --accent:#E08A72; --accent-soft:#3A241E;
    --me:#7FB0DE; --me-soft:#1E2F40; --you:#E2B45A; --you-soft:#3A2E14;
    --both:#9DC47F; --both-soft:#243020; --done:#6CC08F; --done-soft:#183025;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15181B; --surface:#1D2125; --ink:#E6E8EA; --muted:#9AA2AA; --line:#30363C;
  --accent:#E08A72; --accent-soft:#3A241E;
  --me:#7FB0DE; --me-soft:#1E2F40; --you:#E2B45A; --you-soft:#3A2E14;
  --both:#9DC47F; --both-soft:#243020; --done:#6CC08F; --done-soft:#183025;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding:0 16px}
.wrap{max-width:900px;margin:0 auto;padding-block:36px 72px}
h1,h2{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,6vw,3.2rem);font-weight:700}
h2{font-size:1.45rem;font-weight:600;margin-top:40px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 .sub{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted)}
p{max-width:68ch;margin:8px 0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.goal{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);padding:16px 18px}
.goal p{margin:4px 0}
.progress{margin-top:20px;background:var(--surface);border:1px solid var(--line);padding:16px 18px}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);margin-top:10px;display:flex}
.bar span{display:block;height:100%}
.counts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;font-size:14.5px}
.counts b{font-family:var(--display);font-size:1.3rem;margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:16px;font-size:14px;align-items:center}
.who{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:3px;white-space:nowrap}
.w-me{background:var(--me-soft);color:var(--me)}
.w-you{background:var(--you-soft);color:var(--you)}
.w-both{background:var(--both-soft);color:var(--both)}
.st{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:3px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.st.done{background:var(--done-soft);color:var(--done);border-color:transparent}
.st.wait{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.steps{display:grid;gap:8px;margin-top:12px}
details{background:var(--surface);border:1px solid var(--line)}
details.isdone{border-left:4px solid var(--done)}
details.iswait{border-left:4px solid var(--accent)}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:12px 14px}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.num{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--accent)}
.title{font-weight:600}
.title .who{margin-left:6px;vertical-align:1px}
.right{display:flex;gap:6px;align-items:center}
.chev{font-family:var(--mono);color:var(--muted);transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.body{padding:2px 16px 16px 62px;border-top:1px dashed var(--line)}
.body dl{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;margin:12px 0 0;font-size:15px}
.body dt{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:3px}
.body dd{margin:0}
.result{margin-top:12px;background:var(--done-soft);padding:10px 12px;font-size:14.5px}
.result b{color:var(--done)}
@media (max-width:560px){.body{padding-left:16px}.body dl{grid-template-columns:1fr}.body dt{padding-top:6px}}
.note{margin-top:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);font-size:14.5px}
footer{margin-top:56px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
